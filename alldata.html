<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile / Data</title>

  <!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Trirong:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="share.css">
  <link rel="stylesheet" href="hub.css?v=1">
</head>
<body>
  <button id="menu-toggle" class="sidebar-toggle" aria-label="Open menu">
    <span class="menu-icon"><span></span><span></span><span></span></span>
  </button>
  <nav id="sidebar" class="sidebar">
    <button id="close-sidebar" class="close-btn" aria-label="Close menu">&times;</button>
    <ul class="menu">
      <li class="menu-item"><a href="allcard.html">รวมโหมดการ์ด</a></li>
      <li class="menu-item"><a href="allmission.html">ภารกิจ</a></li>
      <li class="menu-item"><a class="active" href="alldata.html">ข้อมูลส่วนตัว/กระดานคะแนน</a></li>
    </ul>
  </nav>
  <div id="overlay" class="overlay"></div>

  <header class="hub-header">
    <h1 class="hub-title" style="margin-left:120px;">ข้อมูลส่วนตัว</h1>
    <div class="hub-actions"><img class="hub-logo" src="assets/logo.png" alt="Logo"></div>
  </header>

  <div class="hub-grid">
    <a class="tile" href="profile.html">
      <h3><span class="bullet">👤</span>โปรไฟล์ของฉัน</h3>
      <p>ข้อมูลผู้ใช้</p>
    </a>
    <a class="tile" href="feedback.html">
      <h3><span class="bullet">💬</span>แสดงความคิดเห็น</h3>
      <p>แสดงความคิดเห็น</p>
    </a>
    <a class="tile" href="leaderboard.html">
      <h3><span class="bullet">🏆</span>กระดานคะแนน</h3>
      <p>ตารางคะแนน</p>
    </a>
  </div>

  <script>
    (function(){
      const $ = id => document.getElementById(id);
      $("menu-toggle")?.addEventListener("click", ()=>{
        $("sidebar").classList.add("open"); $("overlay").classList.add("active");
      });
      const close = ()=>{ $("sidebar").classList.remove("open"); $("overlay").classList.remove("active"); };
      $("close-sidebar")?.addEventListener("click", close);
      $("overlay")?.addEventListener("click", close);
    })();
  </script>
</body>
</html>

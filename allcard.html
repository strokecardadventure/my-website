  <link rel="stylesheet" href="global.css">

<body>
  <!-- Drawer: มีแค่ 3 รายการ -->

<div id="overlay" class="overlay"></div>

<header class="hub-header">
  <!-- เหลือปุ่มเมนูไว้แค่ตัวเดียวใน header -->

    <span class="menu-icon"><span></span><span></span><span></span></span>

  <h1 style="margin-left:95px;">
    รวมโหมดการ์ด

  <div class="hub-actions">
    <img id="open-daily-from-logo" class="hub-logo" src="assets/logo.png" alt="Logo">

  <!-- Tiles -->

      <p>สุ่ม/ปลดล็อกการ์ด</p>

  <p class="hub-note">ถ้ายังไม่ได้รับวันนี้ ระบบจะเด้งรางวัลอัตโนมัติบนหน้านี้ หรือกดโลโก้มุมขวาบน/ปุ่ม 🎁 ก็ได้</p>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAY684l419wAeZwfMLS5dJVfZaNuW3drTY",
      authDomain: "login-ba993.firebaseapp.com",
      projectId: "login-ba993",
      storageBucket: "login-ba993.appspot.com",
      messagingSenderId: "86689747767",
      appId: "1:86689747767:web:0bd80f58f6516d4c73c0b2",

    // ให้ daily.js ใช้งาน
    window.auth = firebase.auth();

  <!-- Daily rewards -->
  <script src="daily.js?v=5"></script>

  <!-- Drawer toggle -->
  <script>
    (function(){
      const $ = id => document.getElementById(id);
      $("menu-toggle")?.addEventListener("click", ()=>{
        $("sidebar").classList.add("open"); $("overlay").classList.add("active");
      });
      const close = ()=>{ $("sidebar").classList.remove("open"); $("overlay").classList.remove("active"); };
      $("close-sidebar")?.addEventListener("click", close);
      $("overlay")?.addEventListener("click", close);
    })();
  </script>
  <script>
  async function logout() {
    try {
      await firebase.auth().signOut();
      location.href = "login.html"; // หรือหน้าไหนก็ได้
    } catch (err) {
      alert("Sign out failed: " + (err?.message || err));
    }
  }
  </script>
</body>

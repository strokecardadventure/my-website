<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ตารางคะแนน</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b91c1c">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>

  <!-- Theme + shared components -->
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="share.css">

  <style>
    /* Tabs look like small chips, not full-width blocks */
    .tabs{display:flex;gap:8px;margin:8px 16px 16px;flex-wrap:wrap}
    .tabs .btn{
      padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:10px;cursor:pointer;
      width:auto; display:inline-flex; align-items:center;
    }
    .tabs .btn.active{border-color:#b91c1c}

    /* Board rows */
    .board{margin: 0 16px 16px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #eee}
    .row:last-child{border-bottom:none}
    .sub{font-size:12px;color:#666}
  </style>
</head>
<body>
  <!-- Sidebar (hamburger) -->
  <header class="sub-header">
  <button class="back-btn" onclick="location.href='alldata.html'">Back</button>
  </header>

  <h1 style="text-align:center;margin:32px 0 6px;font-weight:900;color:#e53935;font-size:2.3rem;">
    🏆 ตารางคะแนน
  </h1>

  <section class="panel" style="padding-bottom:6px">
    <div class="tabs">
      <button id="tabPoints"  class="btn active">Points</button>
      <button id="tabQuizzes" class="btn">Quizzes</button>
      <button id="tabStreak"  class="btn">Streak</button>
    </div>
    <div id="board" class="board">
      <div class="row">กำลังโหลด…</div>
    </div>
  </section>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAY684l419wAeZwfMLS5dJVfZaNuW3drTY",
      authDomain: "login-ba993.firebaseapp.com",
      projectId: "login-ba993",
      storageBucket: "login-ba993.appspot.com",
      messagingSenderId: "86689747767",
      appId: "1:86689747767:web:0bd80f58f6516d4c73c0b2",
      measurementId: "G-33LJCV1MD8"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db   = firebase.firestore();

    function setupSidebar(){
      const openBtn = document.getElementById("menu-toggle");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const closeBtn= document.getElementById("close-sidebar");
      const open = ()=>{ if(sidebar) sidebar.classList.add("open"); if(overlay) overlay.classList.add("active"); };
      const close= ()=>{ if(sidebar) sidebar.classList.remove("open"); if(overlay) overlay.classList.remove("active"); };
      openBtn?.addEventListener("click", open);
      closeBtn?.addEventListener("click", close);
      overlay?.addEventListener("click", close);
      document.querySelectorAll("#sidebar .menu-item a").forEach(a=>{
        if (!a.closest("#logout-link")) a.addEventListener("click", close);
      });
      document.getElementById("logout-link")?.addEventListener("click",(e)=>{
        e.preventDefault(); auth.signOut().then(()=>location.href="login.html");
      });
    }

    const board = document.getElementById('board');
    // เปลี่ยน tabStreak ให้เป็น field 'loginStreak'
    const tabs = { tabPoints:'points', tabQuizzes:'quizCount', tabStreak:'loginStreak' };

    function paintRow(i,u,byKey){
      const name = (u.username||"").toString() || (u.uid||"").slice(0,6) || "user";
      const main = u[byKey] ?? 0;
      // เปลี่ยน sub ให้แสดงข้อมูล pts, quizzes และ loginStreak
      const sub  = `pts:${u.points||0} • quizzes:${u.quizCount||0} • 🔥${u.loginStreak||0}`;
      return `<div class="row"><div><b>#${i}</b> @${name}<div class="sub">${sub}</div></div><div style="font-weight:700">${main}</div></div>`;
    }

    async function load(by='points'){
      board.innerHTML = '<div class="row">กำลังโหลด…</div>';
      try{
        const snap = await db.collection('users').orderBy(by,'desc').limit(100).get();
        if (snap.empty){ board.innerHTML = '<div class="row">ยังไม่มีข้อมูล</div>'; return; }
        let i=1, html='';
        snap.forEach(d=>{
          const u = d.data() || {}; u.uid = d.id;
          html += paintRow(i++, u, by);
        });
        board.innerHTML = html;
      }catch(e){
        board.innerHTML = `<div class="row">โหลดไม่สำเร็จ: ${e.message||e}</div>`;
      }
    }

    for (const id in tabs){
      document.getElementById(id).onclick = (ev)=>{
        document.querySelectorAll('.tabs .btn').forEach(b=>b.classList.remove('active'));
        ev.currentTarget.classList.add('active');
        load(tabs[id]);
      };
    }

    // --------- เพิ่ม: ฟังก์ชันตรวจและอัปเดต streak (เรียก global ถ้ามี, ถ้าไม่มีก็ใช้ fallback) ----------
    // helper: สร้าง YYYY-MM-DD แบบ local
    function localYmd(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    async function ensureStreakUpdated(u){
      if (!u) return;
      // ถ้ามี global helper ที่ login.js ลงไว้ ให้เรียก (ปลอดภัย ถ้าล้มเหลวจะ fallback)
      if (window.updateLoginStreakIfNeeded) {
        try {
          await window.updateLoginStreakIfNeeded(u);
          return;
        } catch (e) {
          console.warn('call global updateLoginStreakIfNeeded failed:', e);
        }
      }

      // Fallback inline (same logic used in login.js)
      try {
        const uref = db.collection('users').doc(u.uid);
        const now = new Date();
        const ymdToday = localYmd(now);
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const ymdYester = localYmd(yesterday);

        const snap = await uref.get();
        let loginStreak = 1;
        let pointsToAdd = 0;

        if (snap.exists) {
          const data = snap.data() || {};
          const lastYmd = data.loginLastYmd || null;
          const prevStreak = Number(data.loginStreak || 0);

          if (lastYmd === ymdToday) {
            // already credited today
            return;
          } else if (lastYmd === ymdYester) {
            loginStreak = prevStreak + 1;
            pointsToAdd = loginStreak;
          } else {
            loginStreak = 1;
            pointsToAdd = 1;
          }
        } else {
          loginStreak = 1;
          pointsToAdd = 1;
        }

        const update = { loginStreak, loginLastYmd: ymdToday };
        if (pointsToAdd > 0) update.points = firebase.firestore.FieldValue.increment(pointsToAdd);
        await uref.set(update, { merge: true });
      } catch (err) {
        console.warn('leaderboard: fallback streak update failed', err);
      }
    }
    // -----------------------------------------------------------------------------------------------

    // ตอนเช็กสถานะผู้ใช้ ให้เรียก ensureStreakUpdated ก่อน load leaderboard
    auth.onAuthStateChanged(async (u)=>{
      if (!u){ location.href='login.html'; return; }
      setupSidebar();
      try { await ensureStreakUpdated(u); } catch(e){ console.warn(e); }
      load('points');
    });
  </script>
</body>
</html>

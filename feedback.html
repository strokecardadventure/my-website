  <!-- 1) RATING + FEEDBACK -->

    <h2>1) ให้คะแนนการ์ดและแสดงความคิดเห็นข้อเสนอแนะ</h2>

          <span class="star dim" data-v="3">★</span>
          <span class="star dim" data-v="4">★</span>

      </div>
      <div class="field">
        <label for="feedbackText">ความคิดเห็นหรือข้อเสนอแนะ</label>
        <textarea id="feedbackText" class="textarea" placeholder="Type your feedback"></textarea>
      </div>
      <button id="saveFeedbackBtn" class="btn">ส่งความคิดเห็นหรือข้อเสนอแนะ</button>

  <!-- 2) BEFAST KNOWLEDGE -->
  <section class="panel">
    <h2>2) ลองบอกสิ่งที่รู้เกี่ยวกับ Stroke ซิ?</h2>
    <div class="hint" style="margin-bottom:8px">
      BEFAST = <b>B</b>alance, <b>E</b>yes, <b>F</b>ace, <b>A</b>rm, <b>S</b>peech, <b>T</b>ime.
      ลองมาแบ่งปันความรู้หลังเรียนมาหน่อยจิ🤓
    </div>
    <textarea id="beFastText" class="textarea" placeholder="Write what you know about stroke/BEFAST"></textarea>
    <button id="saveBeFastBtn" class="btn">ส่งคำตอบ</button>
  </section>

  <!-- 3) PROGRESS + CLAIM -->
  <section class="panel">
    <h2>👍</h2>
    <div id="progressNote" class="hint">Loading…</div>
    <button id="claimRewardBtn" class="btn hidden">Claim +5 points & Event Card #30</button>

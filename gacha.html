        <div>
          <div class="muted" style="display:inline-block;padding:10px 14px;border-radius:12px;border:1px dashed #f0f0f0;">

          </div>

        <div id="costHint" class="muted" style="margin-top:8px">ราคาสุ่มครั้งที่ 1: 10,000 SCA</div>
      </div>

      <div class="muted" style="margin-top:16px;font-size:13px;text-align:center">

      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden">

      <div id="modalBody"></div>
      <div style="margin-top:12px">
        <button id="modalClose" class="btn btn-red">ปิด</button>

    </div>

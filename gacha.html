<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Stroke Card Adventure — Gacha</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- PWA / same theme css as profile -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b91c1c">
  <link rel="stylesheet" href="global.css?v=8">
  <link rel="stylesheet" href="share.css?v=prelogo">
  <link rel="stylesheet" href="profile.css?v=11">

  <style>
    /* small local tweaks for card area */
    .gacha-wrap{max-width:900px;margin:18px auto;padding:8px}
    .gacha-panel{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .card-row{display:flex;gap:14px;justify-content:center;margin:18px 0}
    .gacha-card{width:110px;height:160px;border-radius:12px;background:linear-gradient(180deg,#f2f2f2,#e9e9ee);display:flex;align-items:center;justify-content:center;color:#777;font-size:48px;box-shadow:0 8px 18px rgba(0,0,0,.06)}
    .gacha-header{display:flex;align-items:center;gap:12px;justify-content:space-between}
    .gacha-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
    .btn-gacha{background:#e539ef;color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:800;cursor:pointer}
    .meta-small{color:var(--grey);font-size:13px}
    /* match top-right SCA style small */
    .sca-top{font-weight:800;color:#c62828}
  </style>
</head>
<body>
  <!-- reuse profile header style -->
  <header class="sub-header">
    <button class="back-btn" id="backBtn">Back</button>
  </header>

  <h1 class="page-title">🎴 ปลดล็อกการ์ด (Gacha)</h1>

  <div class="wrap gacha-wrap">
    <section class="gacha-panel">
      <div class="gacha-header">
        <div>
          <div class="muted">การ์ดที่ยังขาด: <span id="missing">0</span> / <span id="total">60</span></div>
          <div class="meta-small" style="margin-top:6px">ครั้งที่สุ่มติดต่อกัน: <span id="streak">0</span></div>
        </div>
        <div class="sca-top">SCA Coins: <span id="coins">0</span></div>
      </div>

      <div class="card-row" id="cardRow">
        <div class="gacha-card">?</div>
        <div class="gacha-card">?</div>
        <div class="gacha-card">?</div>
      </div>

      <div class="gacha-cta">
        <button id="gachaBtn" class="btn-gacha">สุ่มการ์ด — 10,000 SCA</button>
        <div id="costHint" class="meta-small">ราคาสุ่มครั้งที่ 1: 10,000 SCA</div>
      </div>

      <div class="muted" style="margin-top:12px; text-align:center; font-size:13px">
        (โหมด: Guaranteed-new — สุ่มเฉพาะการ์ดที่ยังไม่มี) · ราคาขึ้นเป็น: 10k → 20k → 40k → ... → 1.28M → cap 1.5M
      </div>
    </section>
  </div>

  <!-- modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modalTitle">คุณได้การ์ดใหม่!</h3>
      <div id="modalBody"></div>
      <button id="modalClose" class="btn btn-red">ปิด</button>
    </div>
  </div>

  <!-- Firebase libs (same as profile) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- gacha script -->
  <script src="gacha.js?v=1"></script>
</body>
</html>
